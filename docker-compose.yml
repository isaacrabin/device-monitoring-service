services:
  postgres:
      image: postgres:15-alpine
      container_name: device-monitoring-postgres
      environment:
        POSTGRES_DB: device_monitoring
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: password
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d device_monitoring"]
        interval: 5s
        timeout: 5s
        retries: 10
        start_period: 10s
      networks:
        - monitoring-network
      restart: unless-stopped
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: device-monitoring-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/device_monitoring
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_PROFILES_ACTIVE: docker
      # DO NOT set SPRING_JPA_HIBERNATE_DDL_AUTO here — let application.yml control it
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - monitoring-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:8080/api
    container_name: device-monitoring-frontend
    ports:
      - "3000:3000"
    environment:
      # Use the service name, NOT localhost — frontend container can't reach localhost:8080
      NEXT_PUBLIC_API_URL: http://backend:8080/api
    depends_on:
      - backend
    networks:
      - monitoring-network
    restart: unless-stopped

networks:
  monitoring-network:
    driver: bridge

volumes:
  postgres_data:
